name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Arize-ai/phoenix.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Rebase onto upstream (keep fork's changes on conflicts)
        id: rebase
        run: |
          if git rebase -X theirs upstream/main; then
            echo "rebase_status=success" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "rebase_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.rebase_status == 'success'
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/KaloyanBorisov/phoenix.git
          git push origin main --force-with-lease

      - name: Report conflict
        if: steps.rebase.outputs.rebase_status == 'conflict'
        run: |
          {
            echo '## ⚠️ Upstream sync failed — manual rebase required'
            echo ''
            echo 'The daily rebase onto `Arize-ai/phoenix:main` encountered conflicts that could not be auto-resolved.'
            echo ''
            echo '**To fix manually:**'
            echo '```bash'
            echo 'git fetch upstream'
            echo 'git rebase -X theirs upstream/main'
            echo '# Resolve any remaining conflicts'
            echo 'git rebase --continue'
            echo 'git push origin main --force-with-lease'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync failed — rebase hit unresolved conflicts. See job summary for manual fix steps."
          exit 1
