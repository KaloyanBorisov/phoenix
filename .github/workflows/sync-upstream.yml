name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Arize-ai/phoenix.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Rebase onto upstream (keep fork's changes on conflicts)
        id: rebase
        run: |
          if git rebase -X theirs upstream/main; then
            echo "rebase_status=success" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "rebase_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.rebase_status == 'success'
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/KaloyanBorisov/phoenix.git
          git push origin main --force-with-lease

      - name: Open issue on conflict
        if: steps.rebase.outputs.rebase_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-conflict',
              state: 'open',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Upstream sync failed — manual rebase required',
                body: [
                  '## Upstream sync failed',
                  '',
                  'The daily rebase onto `Arize-ai/phoenix:main` encountered conflicts that could not be auto-resolved.',
                  '',
                  '**To fix manually:**',
                  '```bash',
                  'git fetch upstream',
                  'git rebase -X theirs upstream/main',
                  '# Resolve any remaining conflicts',
                  'git rebase --continue',
                  'git push origin main --force-with-lease',
                  '```',
                  '',
                  `Triggered by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n'),
                labels: ['upstream-conflict'],
              });
            }
